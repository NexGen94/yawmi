# Yawmi web: static PWA served on 8080 by nginx-unprivileged. Installed as
# /etc/nginx/conf.d/default.conf, so this file holds the server block only.
# Traefik sends /v1 to the API (priority 100) and everything else here (priority 1);
# TLS is terminated at Traefik.
server {
    # IPv4 only: Traefik reaches the container over the Docker network, and a host without
    # IPv6 must not stop nginx from starting.
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_types text/css text/javascript application/javascript application/json application/manifest+json image/svg+xml;

    # The shell: always revalidated, so a new release is seen on the next load and the
    # service worker is never served stale.
    location = /sw.js {
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/security-headers.conf;
    }

    location = /index.html {
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/security-headers.conf;
    }

    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/security-headers.conf;
    }

    # Content-hashed build output: safe to keep for a year. A missing hashed file must be a
    # 404, never index.html, or a stale page would cache HTML under a script URL.
    location ^~ /assets/ {
        try_files $uri =404;
        # No `always` on this line: the 404 of a missing file must not be cached for a year.
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/security-headers.conf;
    }

    # The API lives behind Traefik, never here. A request that reaches this container anyway
    # is a routing mistake and must fail loudly instead of returning the app shell.
    location ^~ /v1 {
        add_header Cache-Control "no-store" always;
        include /etc/nginx/security-headers.conf;
        return 404;
    }

    # Container healthcheck.
    location = /healthz {
        access_log off;
        default_type text/plain;
        add_header Cache-Control "no-store" always;
        include /etc/nginx/security-headers.conf;
        return 200 "ok\n";
    }

    # Everything else (icons, workbox runtime, app routes): revalidate each time.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/security-headers.conf;
    }
}
