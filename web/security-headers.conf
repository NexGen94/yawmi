# Sent with every response. nginx does not inherit add_header into a location that sets its
# own add_header, so every location includes this file (web/tests/nginx.test.ts checks it).
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; connect-src 'self'; worker-src 'self'; manifest-src 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
