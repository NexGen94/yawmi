name: web-tests

on:
  pull_request:
    paths:
      - "web/**"
      - "contracts/domain-vectors/**"
      - "openapi/openapi.json"
      - ".github/workflows/web-tests.yml"
  push:
    branches: [main]
    paths:
      - "web/**"
      - "contracts/domain-vectors/**"
      - "openapi/openapi.json"
      - ".github/workflows/web-tests.yml"

permissions:
  contents: read

concurrency:
  group: web-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      # src/api/schema.d.ts is generated from openapi/openapi.json and checked in; a server change
      # that was not regenerated (or a hand edit of the file) fails here.
      - name: Generated API types match openapi/openapi.json
        run: |
          npm run gen:api
          git diff --exit-code -- src/api
          test -z "$(git status --porcelain -- src/api)"

      - name: Typecheck (app, service worker, tooling)
        run: npm run typecheck

      - name: Tests
        run: npx vitest run

      - name: Build
        run: npm run build

      - name: First-load JS budget (80 KB gzip)
        run: node scripts/check-budget.mjs
