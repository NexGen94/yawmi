name: swift-tests

on:
  pull_request:
    paths:
      - "YawmiKit/**"
      - "contracts/**"
      - "openapi/openapi.json"
      - ".github/workflows/swift-tests.yml"
  push:
    branches: [main]
    paths:
      - "YawmiKit/**"
      - "contracts/**"
      - "openapi/openapi.json"
      - ".github/workflows/swift-tests.yml"

permissions:
  contents: read

concurrency:
  group: swift-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Domain and SyncClient import Foundation only, so the whole package builds and tests on
    # Windows. The whole repository is checked out: the tests read contracts/domain-vectors/v1/
    # and openapi/openapi.json from the repository root.
    runs-on: windows-latest
    timeout-minutes: 45

    defaults:
      run:
        working-directory: YawmiKit

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: compnerd/gha-setup-swift@9ff1ee4c44888c5817fc14d1b257ac8cabb4935f # v0.5.1
        with:
          swift-version: swift-6.4.2-release
          swift-build: 6.4.2-RELEASE

      - name: Swift version
        run: swift --version

      - name: Build
        run: swift build

      - name: Tests
        run: swift test
