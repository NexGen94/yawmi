name: web-image

# Builds the yawmi-web image and pushes it to GHCR when a tag web-vX.Y.Z is pushed, e.g.
#   git tag web-v0.1.0 && git push origin web-v0.1.0     (needs Abdullah's approval to push)
# The image is ghcr.io/nexgen94/yawmi-web:X.Y.Z, private like the repository. The server pulls
# it with a read-only token typed on its own terminal (deploy/RUNBOOK.md), never one stored here.

on:
  push:
    tags:
      - "web-v*"

permissions:
  contents: read

concurrency:
  group: web-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/nexgen94/yawmi-web

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Version from the tag
        run: |
          version="${GITHUB_REF_NAME#web-v}"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::the tag must look like web-v1.2.3, got ${GITHUB_REF_NAME}"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      # The build stage runs the first-load JS budget (80 KB gzip), so an over-budget bundle
      # fails here before anything is pushed.
      - name: Build
        run: |
          docker build --pull \
            --tag "$IMAGE:$VERSION" \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.version=${VERSION}" \
            web

      # The image cannot be built on the developer machine (no Docker), so this is the first
      # real proof of the headers, the caching rules and the non-root user.
      - name: Smoke test
        run: |
          test "$(docker run --rm --entrypoint id "$IMAGE:$VERSION" -u)" = "101"
          docker run -d --name yawmi-web-smoke --read-only --tmpfs /tmp -p 8080:8080 "$IMAGE:$VERSION"
          for _ in $(seq 1 20); do
            curl -fsS -o /dev/null http://localhost:8080/healthz && break
            sleep 1
          done
          header() { curl -sS -D - -o /dev/null "http://localhost:8080$1" | tr -d '\r'; }
          for path in /sw.js /index.html /manifest.webmanifest /some/app/route; do
            header "$path" | grep -iq '^cache-control: no-cache$' || { echo "::error::$path is not no-cache"; exit 1; }
          done
          asset="$(docker exec yawmi-web-smoke sh -c 'ls /usr/share/nginx/html/assets | head -n 1')"
          header "/assets/$asset" | grep -iq '^cache-control: public, max-age=31536000, immutable$' \
            || { echo "::error::hashed asset is not immutable"; exit 1; }
          header /index.html | grep -iq "^content-security-policy: default-src 'self'" \
            || { echo "::error::CSP is missing"; exit 1; }
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/v1/health/live)" = "404"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/assets/missing.js)" = "404"
          docker rm -f yawmi-web-smoke > /dev/null

      - name: Log in to GHCR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Push
        run: docker push "$IMAGE:$VERSION"
