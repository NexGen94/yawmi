name: api-image

# Builds the yawmi-api image and pushes it to GHCR when a tag api-vX.Y.Z is pushed, e.g.
#   git tag api-v0.1.0 && git push origin api-v0.1.0     (needs Abdullah's approval to push)
# The image is ghcr.io/nexgen94/yawmi-api:X.Y.Z. A package created from a private repository
# starts private; the server pulls it with a read-only token typed on its own terminal
# (deploy/RUNBOOK.md), never with a token stored in this repository.

on:
  push:
    tags:
      - "api-v*"

permissions:
  contents: read

concurrency:
  group: api-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/nexgen94/yawmi-api

    steps:
      # Full history, so the next step can tell whether the tag is on main.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      # A tag on an unreviewed branch must never publish an image.
      - name: Tag is on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::${GITHUB_REF_NAME} does not point at a commit that is on main"
            exit 1
          fi

      - name: Version from the tag
        run: |
          version="${GITHUB_REF_NAME#api-v}"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::the tag must look like api-v1.2.3, got ${GITHUB_REF_NAME}"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Build
        run: |
          docker build --pull \
            --tag "$IMAGE:$VERSION" \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.version=${VERSION}" \
            api

      # The image cannot be built on the developer machine (no Docker), so these checks are the
      # first real proof that it runs as the non-root user the secrets loader expects.
      - name: Smoke test
        run: |
          test "$(docker run --rm --entrypoint id "$IMAGE:$VERSION" -u)" = "10001"
          docker run --rm --entrypoint python "$IMAGE:$VERSION" -c "import yawmi.main as m; print(m.app.title)"
          docker run --rm --entrypoint yawmi-admin "$IMAGE:$VERSION" --help > /dev/null

      - name: Log in to GHCR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Push
        run: docker push "$IMAGE:$VERSION"
