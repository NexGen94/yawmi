name: api-tests

on:
  pull_request:
    paths:
      - "api/**"
      - "contracts/**"
      - ".github/workflows/api-tests.yml"
  push:
    branches: [main]
    paths:
      - "api/**"
      - "contracts/**"
      - ".github/workflows/api-tests.yml"

permissions:
  contents: read

concurrency:
  group: api-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      # Throwaway Postgres for the migration tests. The database is named raqib because
      # the yawmi schema lives inside the Raqib database in production. `trust` keeps any
      # password out of the repository; the container is only reachable from this job.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: raqib
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d raqib"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      # With CI set, the database tests fail (they do not skip) if TEST_DATABASE_URL is missing.
      CI: "true"
      TEST_DATABASE_URL: postgresql://postgres@localhost:5432/raqib

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true
          cache-dependency-glob: api/uv.lock

      - name: Install dependencies
        working-directory: api
        run: uv sync --locked

      - name: Ruff lint
        working-directory: api
        run: uv run ruff check .

      - name: Ruff format check
        working-directory: api
        run: uv run ruff format --check .

      - name: SQL lint
        run: uv run --project api sqlfluff lint api/db/migrations --dialect postgres

      # The tests apply api/tests/fixtures/raqib_stub.sql (idempotent) to the raqib
      # database before each test, so the GRANTs in 0002 resolve as they do in production.
      - name: Tests
        working-directory: api
        run: uv run pytest -q -ra

      # The shared domain vectors are generated from the Python reference implementation.
      # 1. --check: the committed files equal what the generator produces (no writes).
      # 2. Stability rule against the BASE branch, not only this checkout: the base's vector files
      #    are extracted with git archive and swapped in, then the generator's guard runs against
      #    them. A dropped id, a changed input, or a changed expect without a rulesVersion bump
      #    fails even if the PR deleted and regenerated the files. Plain additions pass, and the
      #    regenerated result must again equal the PR's committed files.
      # The SHA reaches the shell through env, never through ${{ }} inside run.
      # uv flags: --no-sync runs in the environment the "Install dependencies" step created with
      # `uv sync --locked` (that step is the one that fails on a uv.lock out of date with
      # pyproject.toml), so nothing is resolved, installed or built here; --no-build states the
      # same for build scripts; --locked is kept for the explicit intent but checks nothing
      # further once --no-sync is given. A syncing `uv run --no-build` cannot work in this
      # project: http-ece (via pywebpush) ships as an sdist only, and the api project itself is
      # an editable hatchling build.
      - name: Domain vectors match the reference implementation
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          uv run --locked --no-sync --no-build --project api python -I api/tools/gen_domain_vectors.py --check
          test -z "$(git status --porcelain --untracked-files=all -- contracts/)"
          if [ -n "$BASE_SHA" ] && git ls-tree --name-only "$BASE_SHA" contracts/domain-vectors/v1/ 2>/dev/null | grep -q '\.json$'; then
            mkdir -p "$RUNNER_TEMP/base"
            git archive "$BASE_SHA" contracts/domain-vectors/v1 | tar -x -C "$RUNNER_TEMP/base"
            rm -f contracts/domain-vectors/v1/*.json
            cp "$RUNNER_TEMP/base"/contracts/domain-vectors/v1/*.json contracts/domain-vectors/v1/
            uv run --locked --no-sync --no-build --project api python -I api/tools/gen_domain_vectors.py --init
            git diff --exit-code -- contracts/
          else
            echo "base has no committed vectors yet: nothing to guard against"
          fi
